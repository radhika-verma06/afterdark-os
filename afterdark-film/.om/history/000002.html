<script>

  const esc = (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c] || c;

  // Each character sits in its own mask so it can rise into place; spaces keep their width.
  title.innerHTML = [...V.title].map((c) => c === ' ' ? ' ' : `<span class="mask"><span class="ch">${esc(c)}</span></span>`).join('');

  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  tl.addLabel('scene:title', 0)

  const counter = { v: 0 };
  tl.addLabel('scene:stat', 3.4)
    .fromTo('#s-stat', { opacity: 0 }, { opacity: 1, duration: .3 }, 3.4)
    .fromTo('.stat .lbl', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: .6 }, 3.7)
    .fromTo(counter, { v: 0 }, { v: V.stat, duration: 1.3, ease: 'expo.out',

    .to('#s-stat', { opacity: 0, scale: .96, duration: .45, ease: 'power2.in' }, 5.8);

  tl.addLabel('scene:end', 6.3)
