<div id="film" data-composition-id="afterdark-demo" data-width="1920" data-height="1080">

</div>
<script>
const V=OM.vars();
const scenes=[
 {id:'problem',start:0,end:14,no:'01 / 05',kicker:'The problem',src:'assets/shots/overview.png',
  words:'Campus lighting reports are scattered across emails, spreadsheets and maintenance requests.',sub:'When the budget is limited, which repair should happen first?',keys:['scattered','budget']},
 {id:'map',start:14,end:28,no:'02 / 05',kicker:'One campus map',src:'assets/shots/map.png',
  words:'AfterDark OS puts every report on one campus map.',sub:'Pathways, lights, buildings and open issues in one place.',keys:['one','map']},
 {id:'planner',start:28,end:44,no:'03 / 05',kicker:'The optimiser',src:'assets/shots/planner.png',
  words:'Choose a budget. Compare every feasible repair. See the coverage gain.',sub:'Length, evening footfall and capped overlapping gains — exact search, not a black box.',keys:['budget','coverage']},
 {id:'issues',start:44,end:56,no:'04 / 05',kicker:'The workflow',src:'assets/shots/issues.png',
  words:'Track every report from reported to field-checked.',sub:'Strict status transitions and a maintenance history for every issue.',keys:['reported','field-checked']},
 {id:'end',start:56,end:60,no:'05 / 05',kicker:'AfterDark OS',src:'assets/shots/overview.png',
  words:'Better-lit paths. Smarter repairs. Safer campuses.',sub:'Built for the people who keep a campus moving after dark.',keys:['Smarter','Safer']}
];
const host=document.getElementById('scenes'), wordEls={};
for(const s of scenes){
 const el=document.createElement('section'); el.className='scene'; el.id='sc-'+s.id;
 const keys=new Set((s.keys||[]).map(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'')));
 const words=s.words.split(/\s+/).map(w=>`<span class="word${keys.has(w.toLowerCase().replace(/[^a-z0-9]/g,''))?' key':''}">${w.replace(/</g,'&lt;')}</span>`).join('');
 el.innerHTML=`<div class="cap"><div class="kicker">${s.kicker}</div><div class="words">${words}</div><div class="sub">${s.sub}</div></div>`;
 host.appendChild(el); wordEls[s.id]=[...el.querySelectorAll('.word')];
}
const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
tl.to('#progress i',{scaleX:1,duration:60,ease:'none'},0);
const screen=document.getElementById('screen'), panel=document.getElementById('panel');
for(const s of scenes){
 const el=document.getElementById('sc-'+s.id), words=wordEls[s.id];
 const gap=Math.max(.32,Math.min(.75,(s.end-s.start-4)/Math.max(1,words.length)));
 tl.addLabel('scene:'+s.id,s.start)
  .call(()=>{document.getElementById('sceneNo').textContent=s.no},null,s.start)
  .set(screen,{attr:{src:s.src}},s.start)
  .set('.scene',{opacity:0},s.start)
  .set(el,{opacity:1},s.start)
  .fromTo(el.querySelector('.kicker'),{opacity:0,x:-20},{opacity:1,x:0,duration:.5},s.start+.08)
  .fromTo(el.querySelector('.sub'),{opacity:0,y:14},{opacity:1,y:0,duration:.55},s.start+.55)
  .fromTo(panel,{y:26,scale:.985,rotate:-1.2},{y:0,scale:1,rotate:-1.2,duration:1.2,ease:'power2.out'},s.start)
  .to(panel,{y:-10,scale:1.015,duration:s.end-s.start-1.2,ease:'none'},s.start+1.2);
 words.forEach((w,i)=>tl.fromTo(w,{y:42,opacity:0,rotateX:-55,filter:'blur(8px)'},{y:0,opacity:1,rotateX:0,filter:'blur(0px)',duration:.55},s.start+.38+i*gap));
 tl.to(el,{opacity:0,duration:.25,ease:'power2.in'},s.end-.25);
}
tl.addLabel('scene:endcard',60).set('.scene',{opacity:0},60).set('#panel',{opacity:0},59.6)
 .to('#end',{opacity:1,duration:.5},60)
 .fromTo('#end .mk',{opacity:0,y:28},{opacity:1,y:0,duration:.8,ease:'expo.out'},60.1)
 .fromTo('#end .tag',{opacity:0,y:16},{opacity:1,y:0,duration:.6},60.55)
 .fromTo('#end .rule',{scaleX:0},{scaleX:1,duration:.7,ease:'power2.inOut'},60.7)
 .to({},{duration:V.endHold});
window.__timelines['afterdark-demo']=tl;
OM.music({product:'hardware',style:'pulse:dark',drop:'planner',ending:'button',brand:'AfterDark OS',bpm:104});
OM.sfx('whoosh',14);OM.sfx('hit',14);OM.sfx('whoosh',28);OM.sfx('hit',28);
OM.sfx('whoosh',44);OM.sfx('chime',60.1);OM.sfx('tick',3);OM.sfx('tick',8);OM.sfx('tick',18);OM.sfx('tick',33);OM.sfx('tick',48);
</script>
