<!doctype html>
<html lang="en-AU" data-om-signature="off" data-composition-variables='[
  {"id":"accent","type":"color","label":"Accent","default":"#2F6B58"},
  {"id":"ink","type":"color","label":"Ink","default":"#17211D"},
  {"id":"paper","type":"color","label":"Paper","default":"#F7F3E8"},
  {"id":"endHold","type":"number","label":"End hold (s)","default":2.4,"min":1,"max":5,"step":0.1,"group":"Timing"}
]'>
<head>
<meta charset="utf-8">
<title>AfterDark OS · demo</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  @font-face{font-family:"Inter";src:url("assets/fonts/Inter-400.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"Inter";src:url("assets/fonts/Inter-600.woff2") format("woff2");font-weight:600}
  @font-face{font-family:"Inter";src:url("assets/fonts/Inter-700.woff2") format("woff2");font-weight:700}
  @font-face{font-family:"Space Grotesk";src:url("assets/fonts/SpaceGrotesk-700.woff2") format("woff2");font-weight:700}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F7F3E8}
  #film{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased}
  #grid{position:absolute;inset:0;opacity:.55;background-image:linear-gradient(rgba(23,33,29,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(23,33,29,.055) 1px,transparent 1px);background-size:64px 64px}
  #wash{position:absolute;inset:0;background:radial-gradient(900px 650px at 78% 46%,rgba(47,107,88,.16),transparent 68%),radial-gradient(700px 500px at 8% 100%,rgba(214,201,173,.32),transparent 65%)}
  #top{position:absolute;left:88px;right:88px;top:52px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:14px;letter-spacing:.15em;text-transform:uppercase;color:rgba(23,33,29,.78)}
  #top b{font-family:"Space Grotesk",sans-serif;font-size:23px;letter-spacing:-.04em;text-transform:none;color:var(--ink)}
  #top b i{font-style:normal;color:var(--accent)}
  #chip{border:1px solid rgba(23,33,29,.25);padding:10px 14px;border-radius:99px;letter-spacing:.12em;font-size:11px;background:rgba(255,255,255,.62);color:rgba(23,33,29,.8)}
  #panel{position:absolute;right:92px;top:172px;width:900px;height:750px;z-index:3;transform:rotate(-1.2deg);border:1px solid rgba(23,33,29,.26);border-radius:20px;overflow:hidden;background:#fffdf8;box-shadow:0 45px 100px rgba(34,44,38,.2),0 0 0 8px rgba(255,255,255,.45)}
  #panel:before{content:"";position:absolute;z-index:4;left:0;right:0;top:0;height:32px;background:rgba(247,243,232,.94);border-bottom:1px solid rgba(23,33,29,.14)}
  #panel:after{content:"";position:absolute;z-index:5;left:16px;top:12px;width:7px;height:7px;border-radius:50%;background:#C96D5B;box-shadow:13px 0 #D8B36B,26px 0 #7FA38F}
  #screen{position:absolute;inset:32px 0 0;width:100%;height:calc(100% - 32px);object-fit:cover;object-position:top left}
  .scene{position:absolute;inset:0;opacity:0;z-index:2}
  .cap{position:absolute;left:88px;top:220px;width:880px}
  .kicker{display:flex;align-items:center;gap:15px;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .kicker:before{content:"";width:32px;height:1px;background:var(--accent)}
  .words{margin-top:25px;font-family:"Space Grotesk",sans-serif;font-size:68px;line-height:1.04;letter-spacing:-.045em;max-width:820px}
  .word{display:inline-block;margin-right:.2em;transform-origin:50% 100%}
  .word.key{color:var(--accent)}
  .sub{margin-top:24px;font-size:21px;line-height:1.5;color:rgba(23,33,29,.62);max-width:650px}
  .sub b{color:var(--ink);font-weight:600}
  #sceneNo{position:absolute;left:88px;bottom:62px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:rgba(23,33,29,.72);z-index:4}
  #progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(23,33,29,.1);z-index:5}
  #progress i{display:block;width:100%;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%}
  #end{position:absolute;inset:0;z-index:7;background:var(--accent);color:#F7F3E8;opacity:0;display:flex;flex-direction:column;justify-content:center;padding-left:90px}
  #end .mk{font-family:"Space Grotesk",sans-serif;font-size:132px;line-height:.9;letter-spacing:-.06em}
  #end .tag{margin-top:25px;font-size:24px;letter-spacing:.14em;text-transform:uppercase;opacity:.82}
  #end .rule{width:500px;height:2px;background:#F7F3E8;margin-top:30px;transform-origin:0 50%;opacity:.7}
</style>
</head>
<body>
<div id="film" data-composition-id="afterdark-demo" data-width="1920" data-height="1080">
  <div id="grid"></div><div id="wash"></div>
  <div id="top"><b>AfterDark<i>.</i></b><span>Campus lighting intelligence</span><span id="chip">HERHACK 2026 · Student Innovation</span></div>
  <div id="panel"><img id="screen" src="assets/shots/overview.png" alt="AfterDark OS interface"></div>
  <div id="scenes"></div>
  <div id="sceneNo">01 / 05</div>
  <div id="progress"><i></i></div>
  <div id="end"><div class="mk">AfterDark.</div><div class="tag">Better-lit paths. Smarter repairs. Safer campuses.</div><div class="rule"></div></div>
</div>
<script>
const V=OM.vars();
const scenes=[
 {id:'problem',start:0,end:14,no:'01 / 05',kicker:'The problem',src:'assets/shots/overview.png',
  words:'Campus lighting reports are scattered across emails, spreadsheets and maintenance requests.',sub:'When the budget is limited, which repair should happen first?',keys:['scattered','budget']},
 {id:'map',start:14,end:28,no:'02 / 05',kicker:'One campus map',src:'assets/shots/map.png',
  words:'AfterDark OS puts every report on one campus map.',sub:'Pathways, lights, buildings and open issues in one place.',keys:['one','map']},
 {id:'planner',start:28,end:44,no:'03 / 05',kicker:'The optimiser',src:'assets/shots/planner.png',
  words:'Choose a budget. Compare every feasible repair. See the coverage gain.',sub:'Length, evening footfall and capped overlapping gains — exact search, not a black box.',keys:['budget','coverage']},
 {id:'issues',start:44,end:56,no:'04 / 05',kicker:'The workflow',src:'assets/shots/issues.png',
  words:'Track every report from reported to field-checked.',sub:'Strict status transitions and a maintenance history for every issue.',keys:['reported','field-checked']},
 {id:'end',start:56,end:60,no:'05 / 05',kicker:'AfterDark OS',src:'assets/shots/overview.png',
  words:'Better-lit paths. Smarter repairs. Safer campuses.',sub:'Built for the people who keep a campus moving after dark.',keys:['Smarter','Safer']}
];
const host=document.getElementById('scenes'), wordEls={};
for(const s of scenes){
 const el=document.createElement('section'); el.className='scene'; el.id='sc-'+s.id;
 const keys=new Set((s.keys||[]).map(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'')));
 const words=s.words.split(/\s+/).map(w=>`<span class="word${keys.has(w.toLowerCase().replace(/[^a-z0-9]/g,''))?' key':''}">${w.replace(/</g,'&lt;')}</span>`).join('');
 el.innerHTML=`<div class="cap"><div class="kicker">${s.kicker}</div><div class="words">${words}</div><div class="sub">${s.sub}</div></div>`;
 host.appendChild(el); wordEls[s.id]=[...el.querySelectorAll('.word')];
}
const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
tl.to('#progress i',{scaleX:1,duration:60,ease:'none'},0);
const screen=document.getElementById('screen'), panel=document.getElementById('panel');
for(const s of scenes){
 const el=document.getElementById('sc-'+s.id), words=wordEls[s.id];
 const gap=Math.max(.32,Math.min(.75,(s.end-s.start-4)/Math.max(1,words.length)));
 tl.addLabel('scene:'+s.id,s.start)
  .call(()=>{document.getElementById('sceneNo').textContent=s.no},null,s.start)
  .set(screen,{attr:{src:s.src}},s.start)
  .set('.scene',{opacity:0},s.start)
  .set(el,{opacity:1},s.start)
  .fromTo(el.querySelector('.kicker'),{opacity:0,x:-20},{opacity:1,x:0,duration:.5},s.start+.08)
  .fromTo(el.querySelector('.sub'),{opacity:0,y:14},{opacity:1,y:0,duration:.55},s.start+.55)
  .fromTo(panel,{y:26,scale:.985,rotate:-1.2},{y:0,scale:1,rotate:-1.2,duration:1.2,ease:'power2.out'},s.start)
  .to(panel,{y:-10,scale:1.015,duration:s.end-s.start-1.2,ease:'none'},s.start+1.2);
 words.forEach((w,i)=>tl.fromTo(w,{y:42,opacity:0,rotateX:-55,filter:'blur(8px)'},{y:0,opacity:1,rotateX:0,filter:'blur(0px)',duration:.55},s.start+.38+i*gap));
 tl.to(el,{opacity:0,duration:.25,ease:'power2.in'},s.end-.25);
}
tl.addLabel('scene:endcard',60).set('.scene',{opacity:0},60).set('#panel',{opacity:0},59.6)
 .to('#end',{opacity:1,duration:.5},60)
 .fromTo('#end .mk',{opacity:0,y:28},{opacity:1,y:0,duration:.8,ease:'expo.out'},60.1)
 .fromTo('#end .tag',{opacity:0,y:16},{opacity:1,y:0,duration:.6},60.55)
 .fromTo('#end .rule',{scaleX:0},{scaleX:1,duration:.7,ease:'power2.inOut'},60.7)
 .to({},{duration:V.endHold});
window.__timelines['afterdark-demo']=tl;
OM.music({product:'hardware',style:'pulse:dark',drop:'planner',ending:'button',brand:'AfterDark OS',bpm:104});
OM.sfx('whoosh',14);OM.sfx('hit',14);OM.sfx('whoosh',28);OM.sfx('hit',28);
OM.sfx('whoosh',44);OM.sfx('chime',60.1);OM.sfx('tick',3);OM.sfx('tick',8);OM.sfx('tick',18);OM.sfx('tick',33);OM.sfx('tick',48);
</script>
</body>
</html>
